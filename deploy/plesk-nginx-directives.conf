# 3. Caché inmutable para activos estáticos empaquetados con hash (Vite /assets/)
# Nota Nginx: add_header en un bloque location anula la herencia superior, por lo que incluimos las cabeceras de seguridad explícitamente en cada bloque.
location /assets/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Activar solo tras verificar HTTPS definitivo en Plesk:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log off;
    try_files $uri =404;
}

# 4. Imágenes estáticas y fuentes en raíz o subdirectorios
location ~* \.(?:webp|jpg|jpeg|png|svg|ico|gif|woff2?|ttf|eot)$ {
    expires 180d;
    add_header Cache-Control "public, max-age=15552000, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log off;
    try_files $uri =404;
}

# 5. Archivos de metadatos y SEO (llms.txt, robots.txt, sitemap.xml, site.webmanifest)
location ~* (?:llms\.txt|robots\.txt|sitemap\.xml|site\.webmanifest)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# 6. Documentos HTML y rutas pre-renderizadas (SSG sin Soft-404)
error_page 404 /404.html;

location = /404.html {
    internal;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

location = / {
    try_files /index.html =404;

    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Activar solo tras verificar HTTPS definitivo en Plesk:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP recomendada tras validar recursos externos (GA4, Maps, Fonts, inline styles Vite):
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://*.googleapis.com https://maps.gstatic.com; frame-ancestors 'self';" always;
}

location / {
    # Quitar barra inclinada final en URLs para evitar contenido duplicado
    rewrite ^/(.*)/$ /$1 permanent;

    # Buscar archivo físico o carpeta pre-renderizada con index.html; si no existe, responder HTTP 404 real
    try_files $uri $uri/index.html =404;

    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
