# ==============================================================================
# Directivas adicionales de Nginx para Plesk / ProfesionalHosting
# Tintorería Mimos Navia, S.L. (https://www.tintoreriamimos.es)
# Ubicación en Plesk: Dominios > tintoreriamimos.es > Configuración de Apache y Nginx
# Sección: "Directivas adicionales de Nginx"
# ==============================================================================

# 1. Compresión Gzip para mejorar el rendimiento y Core Web Vitals (LCP)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/x-javascript
    text/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

# 2. Caché inmutable para activos estáticos empaquetados con hash (Vite /assets/)
location /assets/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
    try_files $uri =404;
}

# 3. Imágenes estáticas y WebP en raíz o subdirectorios
location ~* \.(?:webp|jpg|jpeg|png|svg|ico|gif|woff2?|ttf|eot)$ {
    expires 180d;
    add_header Cache-Control "public, max-age=15552000, stale-while-revalidate=86400";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
    try_files $uri =404;
}

# 4. Archivos de metadatos y SEO (llms.txt, robots.txt, sitemap.xml, site.webmanifest)
location ~* (?:llms\.txt|robots\.txt|sitemap\.xml|site\.webmanifest)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
}

# 5. Documentos HTML y rutas pre-renderizadas (SSG sin Soft-404)
# Sirve la portada raíz, cada ruta pre-renderizada (/ruta/index.html) o devuelve 404 real con /404.html
error_page 404 /404.html;

location = /404.html {
    internal;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location = / {
    try_files /index.html =404;

    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location / {
    # Quitar barra inclinada final en URLs para evitar contenido duplicado
    rewrite ^/(.*)/$ /$1 permanent;

    # Buscar archivo físico o carpeta pre-renderizada con index.html; si no existe, responder HTTP 404 real
    try_files $uri $uri/index.html =404;

    # No almacenar HTML en caché del navegador sin revalidación
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
