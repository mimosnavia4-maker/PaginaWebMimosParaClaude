# ==============================================================================
# Directivas adicionales de Nginx para Plesk / ProfesionalHosting
# Tintorería Mimos Navia, S.L. (https://www.tintoreriamimos.es)
# Ubicación en Plesk: Dominios > tintoreriamimos.es > Configuración de Apache y Nginx
# Sección: "Directivas adicionales de Nginx"
# ==============================================================================

# 1. Compresión Gzip para mejorar el rendimiento y Core Web Vitals (LCP)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/x-javascript
    text/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

# 2. Caché inmutable para activos estáticos empaquetados con hash (Vite /assets/)
location /assets/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
    try_files $uri =404;
}

# 3. Imágenes estáticas y WebP en raíz o subdirectorios
location ~* \.(?:webp|jpg|jpeg|png|svg|ico|gif|woff2?|ttf|eot)$ {
    expires 180d;
    add_header Cache-Control "public, max-age=15552000, stale-while-revalidate=86400";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
    try_files $uri =404;
}

# 4. Archivos de metadatos y SEO (llms.txt, robots.txt, sitemap.xml, site.webmanifest)
location ~* (?:llms\.txt|robots\.txt|sitemap\.xml|site\.webmanifest)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
}

# 5. Documentos HTML y rutas pre-renderizadas (SSG + SPA)
# Sirve el index.html pre-renderizado de cada ruta o delega al router SPA sin caché rígida
location / {
    # Quitar barra inclinada final en URLs para evitar contenido duplicado
    rewrite ^/(.*)/$ /$1 permanent;

    # Buscar primero archivo físico, luego carpeta pre-renderizada con index.html, y finalmente SPA raíz
    try_files $uri $uri/index.html /index.html;

    # No almacenar HTML en caché del navegador sin revalidación
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
